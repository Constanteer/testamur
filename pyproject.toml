[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "testamur"
version = "1.0.0"
description = "A local evidence environment for inspectable work"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Constanteer"}]
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
testamur = "testamur.front_router:main"
testamur-web = "testamur.web_app:main"
testamur-gateway = "testamur.source_gateway_cli:main"
testamur-gateway-mcp = "testamur.source_gateway_project_mcp:main"
testamur-codex-hook = "testamur.codex_gateway_hook:main"

[tool.setuptools.packages.find]
include = ["testamur*"]

[tool.setuptools.package-data]
testamur = ["web/*.html", "web/*.css", "web/*.js"]
