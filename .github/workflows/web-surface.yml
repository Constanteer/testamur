name: web-ui-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: python3 --version && node --version
      - name: Check browser JavaScript
        run: node --check testamur/web/app.js
      - name: Run canonical Web tests
        run: python3 -m unittest tests.test_testamur_web_app
