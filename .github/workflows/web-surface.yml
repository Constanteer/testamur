name: web-ui-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check testamur/web/app.js
      - name: Run canonical Web tests
        run: python -m unittest tests.test_testamur_web_app
