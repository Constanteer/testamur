name: tests

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: 'bash --noprofile --norc -eo pipefail "{0}"'

jobs:
  pytest:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: python3 --version
      - name: Bootstrap isolated test environment
        run: |
          rm -rf .venv-ci
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check --upgrade pip pytest "setuptools>=70" wheel
          .venv-ci/bin/python -m pip install -e .
      - name: Run test suite
        run: .venv-ci/bin/python -m pytest -q
