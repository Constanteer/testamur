name: tests

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: 'bash --noprofile --norc -eo pipefail "{0}"'

jobs:
  pytest:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q
