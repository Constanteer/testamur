name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: python3 --version
      - name: Create isolated test environment
        run: |
          rm -rf .venv-ci
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check -U pip pytest
          .venv-ci/bin/python -m pip install -e .
      - run: .venv-ci/bin/python -m pytest -q
