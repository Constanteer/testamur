name: Testamur

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  testamur:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Release gate
        run: bash scripts/testamur_local_gate.sh release
